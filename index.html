<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG where it is supported, PNG where it is not. Browsers take the
         first format they understand, so the SVG must come first. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <!-- viewport-fit=cover is what gives env(safe-area-inset-*) real values.
         Without it they are always 0, and the chat launcher's safe-area offsets
         did nothing on a phone with a gesture bar or nav bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06050f" />
    <meta
      name="description"
      content="RagDex — Know Your Trades. Grow Your Edge. A trading journal that turns your logged trades into an honest read on your edge and your habits."
    />
    <title>RagDex — Know Your Trades. Grow Your Edge.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
