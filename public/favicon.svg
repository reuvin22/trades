<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RagDex">
  <!--
    The journal and the edge: the R it is kept in, the binding that says
    notebook, and the line that is the point of keeping it.

    Drawn rather than traced from the source render. The palette is the app's
    own (violet accent, not the render's green), and a favicon is read at 16px,
    so only shapes that survive the shrink are here: the render's hatching,
    circuit nodes and candle wicks all turn to noise at that size.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1252"/>
      <stop offset="1" stop-color="#0c0926"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cf6"/>
      <stop offset="1" stop-color="#8f83ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f83ff"/>
      <stop offset="1" stop-color="#3fd8ee"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#plate)"/>

  <!-- The binding. Three bars carry "notebook" on their own; the ruled page
       they used to sit beside was invisible at every size that matters. -->
  <g fill="url(#mark)" opacity="0.95">
    <rect x="9" y="18" width="9" height="3.6" rx="1.8"/>
    <rect x="9" y="30" width="9" height="3.6" rx="1.8"/>
    <rect x="9" y="42" width="9" height="3.6" rx="1.8"/>
  </g>

  <!-- The R. Stroked, because a filled counter closes up when the icon is
       scaled down — but the stroke has to stay well under the bowl's radius or
       the counter closes anyway and the letter reads as a D. -->
  <g fill="none" stroke="url(#mark)" stroke-width="5.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 49V16h9a9.5 9.5 0 0 1 0 19h-9"/>
    <path d="M34 35l10 14"/>
  </g>

  <!-- The edge. Crosses the lower half of the mark rather than its middle, so
       it reads as laid over the R instead of cutting it in two. The casing is
       only wide enough to separate the two — heavier than this and the black
       outline becomes the loudest thing in the icon. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="#0c0926" stroke="#0c0926" stroke-width="6.5">
      <path d="M12 52l10-10 8 5 12-16" fill="none"/>
      <path d="M44.4 27.8 43.6 36.6 36.2 31Z"/>
    </g>
    <path d="M12 52l10-10 8 5 12-16" fill="none"
          stroke="url(#edge)" stroke-width="4.4"/>
    <path d="M44.4 27.8 43.6 36.6 36.2 31Z" fill="#3fd8ee" stroke="#3fd8ee" stroke-width="1.6"/>
  </g>
</svg>
