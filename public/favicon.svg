<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RagDex">
  <!--
    The journal and the edge: a binding, the R it is kept in, and a line that
    rises. Drawn rather than traced from the source render — the palette is the
    app's own violet, and a favicon is read at 16px, where that render's
    hatching, circuit nodes and candle wicks all turn to noise.

    Two things learned by rendering it: the letter must be FILLED with a real
    counter (a stroked bowl closes up on scaling and the R reads as a D), and
    nothing may cross the letter (the trend line needed a black casing to stay
    legible, and that casing became the loudest thing in the icon).
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1252"/>
      <stop offset="1" stop-color="#0c0926"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cf6"/>
      <stop offset="1" stop-color="#8f83ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f83ff"/>
      <stop offset="1" stop-color="#3fd8ee"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#plate)"/>

  <!-- The binding. Three bars carry "notebook" without a page outline, which
       was invisible at every size that matters. -->
  <g fill="url(#mark)" opacity="0.92">
    <rect x="8"  y="17" width="8.5" height="3.4" rx="1.7"/>
    <rect x="8"  y="28" width="8.5" height="3.4" rx="1.7"/>
    <rect x="8"  y="39" width="8.5" height="3.4" rx="1.7"/>
  </g>

  <!-- The R: stem, bowl and leg as three filled shapes. The bowl carries its
       counter as a second contour, cut out by fill-rule. Walls are an even 6
       units all round so the letter holds its colour when it shrinks. -->
  <g fill="url(#mark)">
    <rect x="22" y="12" width="7.5" height="31" rx="1.2"/>
    <path fill-rule="evenodd" d="
      M28 12 H35 A9 9 0 0 1 35 30 H28 Z
      M29.5 18 H35 A3 3 0 0 1 35 24 H29.5 Z"/>
    <path d="M29.5 27 H37 L46.5 43 H39 Z"/>
  </g>

  <!-- The edge, clear of the letter: it lifts off the baseline to the right,
       which is the whole idea of the product in one stroke. -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M10 54 L21 49 L28 52 L43 45" stroke="url(#edge)" stroke-width="3.8"/>
  </g>
  <path d="M42.2 41.2 L49 44.2 L42.6 48.2 Z" fill="#3fd8ee"/>
</svg>
